<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>VideoWall — Player</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; background:#000; overflow:hidden; }
  #stage { position:relative; width:100vw; height:100vh; background:#000; }
  .vw-container { position:absolute; overflow:hidden; background:#000; }
  .vw-title {
    position:absolute; top:0; left:0; right:0; z-index:5;
    background:rgba(10,14,22,.82); color:#e7ecf3;
    font-family:system-ui,sans-serif; font-weight:600;
    display:flex; align-items:center; padding-left:.6em;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .vw-content { position:absolute; inset:0; overflow:hidden; }
  .vw-content iframe { width:100%; height:100%; border:0; display:block; background:#fff; }
  .vw-content img, .vw-content video { width:100%; height:100%; display:block; }
  .vw-placeholder {
    width:100%; height:100%; display:flex; flex-direction:column; gap:.4em;
    align-items:center; justify-content:center; color:#5b6675;
    font-family:system-ui,sans-serif; text-align:center;
  }
  .vw-placeholder b { color:#8b97a8; }
  body.locked, body.locked * { cursor:none !important; }
  body.locked .vw-content { pointer-events:none; }
  #offline {
    position:fixed; right:14px; bottom:14px; z-index:99; display:none;
    background:rgba(127,29,29,.92); color:#fff; font-family:system-ui,sans-serif;
    font-size:13px; padding:6px 12px; border-radius:6px;
  }
</style>
</head>
<body>
  <div id="stage"></div>
  <div id="offline">Sem conexão com o servidor — tentando reconectar…</div>
  <script src="/static/player/player.js"></script>
</body>
</html>
