<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Boas-vindas</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;
    background:linear-gradient(120deg,#0f4c81,#2563eb 55%,#2dd4bf);
    color:#fff;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center}
  .wrap{text-align:center;padding:0 6vw}
  h1{font-size:6.5vw;margin:0 0 1.5vw;font-weight:800;letter-spacing:-.01em}
  p{font-size:2.6vw;margin:0;opacity:.92}
  .badge{display:inline-block;margin-top:3vw;padding:.7vw 2.4vw;border:2px solid rgba(255,255,255,.55);
    border-radius:99px;font-size:1.9vw;letter-spacing:.12em;text-transform:uppercase}
</style>
</head>
<body>
<div class="wrap">
  <h1>Bem-vindo</h1>
  <p>Plataforma corporativa de videowall — edite este conteúdo no painel administrativo.</p>
  <div class="badge">VideoWall</div>
</div>
</body>
</html>
